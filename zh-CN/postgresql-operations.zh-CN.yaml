zabbix_export:
  version: '8.0'
  dashboards:
    - name: 'PostgreSQL 性能与复制'
      auto_start: 'NO'
      pages:
        - name: '会话与事务'
          widgets:
            - type: hostnavigator
              name: '按群组选择目标'
              x: '0'
              'y': '0'
              width: '14'
              height: '14'
              fields:
                - {type: STRING, name: reference, value: 'ZGAAA'}
                - {type: INTEGER, name: status, value: '0'}
                - {type: INTEGER, name: group_by.0.attribute, value: '0'}
                - {type: STRING, name: host_tags.0.tag, value: 'target'}
                - {type: INTEGER, name: host_tags.0.operator, value: '1'}
                - {type: STRING, name: host_tags.0.value, value: 'postgresql'}
            - type: hostcard
              name: '所选主机'
              x: '14'
              'y': '0'
              width: '19'
              height: '2'
              fields:
                - {type: STRING, name: hostid._reference, value: 'ZGAAA._hostid'}
                - {type: INTEGER, name: sections.0, value: '3'}
                - {type: INTEGER, name: sections.1, value: '4'}
            - type: tophosts
              name: '最新指标'
              x: '33'
              'y': '0'
              width: '39'
              height: '2'
              fields:
                - {type: STRING, name: reference, value: 'ZGAAB'}
                - {type: STRING, name: hostids._reference, value: 'ZGAAA._hostids'}
                - {type: INTEGER, name: maintenance, value: '1'}
                - {type: INTEGER, name: show_lines, value: '1'}
                - {type: INTEGER, name: column, value: '1'}
                - {type: INTEGER, name: columns.0.data, value: '2'}
                - {type: STRING, name: columns.0.name, value: '主机'}
                - {type: INTEGER, name: columns.1.data, value: '1'}
                - {type: STRING, name: columns.1.name, value: '连通状态'}
                - {type: STRING, name: columns.1.item, value: 'Ping'}
                - {type: INTEGER, name: columns.1.decimal_places, value: '0'}
                - {type: INTEGER, name: columns.2.data, value: '1'}
                - {type: STRING, name: columns.2.name, value: '版本'}
                - {type: STRING, name: columns.2.item, value: 'Version'}
                - {type: INTEGER, name: columns.2.display_value_as, value: '1'}
                - {type: INTEGER, name: columns.3.data, value: '1'}
                - {type: STRING, name: columns.3.name, value: '连接数'}
                - {type: STRING, name: columns.3.item, value: 'Connections sum: Total'}
                - {type: INTEGER, name: columns.3.decimal_places, value: '0'}
                - {type: INTEGER, name: columns.4.data, value: '1'}
                - {type: STRING, name: columns.4.name, value: '缓存命中率'}
                - {type: STRING, name: columns.4.item, value: 'Cache hit ratio, %'}
                - {type: INTEGER, name: columns.5.data, value: '1'}
                - {type: STRING, name: columns.5.name, value: '运行时长'}
                - {type: STRING, name: columns.5.item, value: 'Uptime'}
            - type: svggraph
              name: '连接与会话状态'
              x: '14'
              'y': '2'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZGAAC'}
                - {type: STRING, name: time_period._reference, value: 'DASHBOARD._timeperiod'}
                - {type: INTEGER, name: legend_columns, value: '2'}
                - {type: INTEGER, name: legend_lines, value: '2'}
                - {type: STRING, name: lefty_min, value: '0'}
                - {type: STRING, name: ds.0.hosts.0, value: '*'}
                - {type: STRING, name: ds.0.items.0, value: 'Connections sum: Active'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'ZGAAA._hostid'}
                - {type: STRING, name: ds.0.color, value: '008E83'}
                - {type: INTEGER, name: ds.0.fill, value: '0'}
                - {type: INTEGER, name: ds.0.width, value: '2'}
                - {type: STRING, name: ds.1.hosts.0, value: '*'}
                - {type: STRING, name: ds.1.items.0, value: 'Connections sum: Idle'}
                - {type: STRING, name: ds.1.override_hostid._reference, value: 'ZGAAA._hostid'}
                - {type: STRING, name: ds.1.color, value: '3478D3'}
                - {type: INTEGER, name: ds.1.fill, value: '0'}
                - {type: INTEGER, name: ds.1.width, value: '2'}
                - {type: STRING, name: ds.2.hosts.0, value: '*'}
                - {type: STRING, name: ds.2.items.0, value: 'Connections sum: Idle in transaction'}
                - {type: STRING, name: ds.2.override_hostid._reference, value: 'ZGAAA._hostid'}
                - {type: STRING, name: ds.2.color, value: '8A53BC'}
                - {type: INTEGER, name: ds.2.fill, value: '0'}
                - {type: INTEGER, name: ds.2.width, value: '2'}
                - {type: STRING, name: ds.3.hosts.0, value: '*'}
                - {type: STRING, name: ds.3.items.0, value: 'Connections sum: Waiting'}
                - {type: STRING, name: ds.3.override_hostid._reference, value: 'ZGAAA._hostid'}
                - {type: STRING, name: ds.3.color, value: 'CD7227'}
                - {type: INTEGER, name: ds.3.fill, value: '0'}
                - {type: INTEGER, name: ds.3.width, value: '2'}
            - type: svggraph
              name: '提交与回滚速率'
              x: '43'
              'y': '2'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZGAAD'}
                - {type: STRING, name: time_period._reference, value: 'DASHBOARD._timeperiod'}
                - {type: INTEGER, name: legend_columns, value: '2'}
                - {type: INTEGER, name: legend_lines, value: '2'}
                - {type: STRING, name: lefty_min, value: '0'}
                - {type: STRING, name: ds.0.hosts.0, value: '*'}
                - {type: STRING, name: ds.0.items.0, value: 'Dbstat: Committed transactions per second'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'ZGAAA._hostid'}
                - {type: STRING, name: ds.0.color, value: '008E83'}
                - {type: INTEGER, name: ds.0.fill, value: '0'}
                - {type: INTEGER, name: ds.0.width, value: '2'}
                - {type: STRING, name: ds.1.hosts.0, value: '*'}
                - {type: STRING, name: ds.1.items.0, value: 'Dbstat: Roll backed transactions per second'}
                - {type: STRING, name: ds.1.override_hostid._reference, value: 'ZGAAA._hostid'}
                - {type: STRING, name: ds.1.color, value: '3478D3'}
                - {type: INTEGER, name: ds.1.fill, value: '0'}
                - {type: INTEGER, name: ds.1.width, value: '2'}
            - type: svggraph
              name: '缓存命中率'
              x: '14'
              'y': '6'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZGAAE'}
                - {type: STRING, name: time_period._reference, value: 'DASHBOARD._timeperiod'}
                - {type: INTEGER, name: legend_columns, value: '2'}
                - {type: INTEGER, name: legend_lines, value: '2'}
                - {type: STRING, name: lefty_min, value: '0'}
                - {type: STRING, name: lefty_max, value: '100'}
                - {type: STRING, name: ds.0.hosts.0, value: '*'}
                - {type: STRING, name: ds.0.items.0, value: 'Cache hit ratio, %'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'ZGAAA._hostid'}
                - {type: STRING, name: ds.0.color, value: '008E83'}
                - {type: INTEGER, name: ds.0.fill, value: '0'}
                - {type: INTEGER, name: ds.0.width, value: '2'}
            - type: svggraph
              name: '死锁与冲突速率'
              x: '43'
              'y': '6'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZGAAF'}
                - {type: STRING, name: time_period._reference, value: 'DASHBOARD._timeperiod'}
                - {type: INTEGER, name: legend_columns, value: '2'}
                - {type: INTEGER, name: legend_lines, value: '2'}
                - {type: STRING, name: lefty_min, value: '0'}
                - {type: STRING, name: ds.0.hosts.0, value: '*'}
                - {type: STRING, name: ds.0.items.0, value: 'Dbstat: Deadlocks per second'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'ZGAAA._hostid'}
                - {type: STRING, name: ds.0.color, value: '008E83'}
                - {type: INTEGER, name: ds.0.fill, value: '0'}
                - {type: INTEGER, name: ds.0.width, value: '2'}
                - {type: STRING, name: ds.1.hosts.0, value: '*'}
                - {type: STRING, name: ds.1.items.0, value: 'Dbstat: Conflicts per second'}
                - {type: STRING, name: ds.1.override_hostid._reference, value: 'ZGAAA._hostid'}
                - {type: STRING, name: ds.1.color, value: '3478D3'}
                - {type: INTEGER, name: ds.1.fill, value: '0'}
                - {type: INTEGER, name: ds.1.width, value: '2'}
            - type: problems
              name: '当前问题'
              x: '14'
              'y': '10'
              width: '58'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZGAAG'}
                - {type: STRING, name: hostids._reference, value: 'ZGAAA._hostids'}
                - {type: INTEGER, name: show, value: '3'}
                - {type: INTEGER, name: show_opdata, value: '2'}
                - {type: INTEGER, name: show_lines, value: '10'}
        - name: '容量与复制'
          widgets:
            - type: hostnavigator
              name: '按群组选择目标'
              x: '0'
              'y': '0'
              width: '14'
              height: '12'
              fields:
                - {type: STRING, name: reference, value: 'ZGBAA'}
                - {type: INTEGER, name: status, value: '0'}
                - {type: INTEGER, name: group_by.0.attribute, value: '0'}
                - {type: STRING, name: host_tags.0.tag, value: 'target'}
                - {type: INTEGER, name: host_tags.0.operator, value: '1'}
                - {type: STRING, name: host_tags.0.value, value: 'postgresql'}
            - type: svggraph
              name: '各数据库容量'
              x: '14'
              'y': '0'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZGBAB'}
                - {type: STRING, name: time_period._reference, value: 'DASHBOARD._timeperiod'}
                - {type: INTEGER, name: legend_columns, value: '2'}
                - {type: INTEGER, name: legend_lines, value: '2'}
                - {type: STRING, name: lefty_min, value: '0'}
                - {type: STRING, name: ds.0.hosts.0, value: '*'}
                - {type: STRING, name: ds.0.items.0, value: 'DB *: Database size'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'ZGBAA._hostid'}
                - {type: STRING, name: ds.0.color, value: '008E83'}
                - {type: INTEGER, name: ds.0.fill, value: '0'}
                - {type: INTEGER, name: ds.0.width, value: '2'}
            - type: svggraph
              name: '各数据库锁总数'
              x: '43'
              'y': '0'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZGBAC'}
                - {type: STRING, name: time_period._reference, value: 'DASHBOARD._timeperiod'}
                - {type: INTEGER, name: legend_columns, value: '2'}
                - {type: INTEGER, name: legend_lines, value: '2'}
                - {type: STRING, name: lefty_min, value: '0'}
                - {type: STRING, name: ds.0.hosts.0, value: '*'}
                - {type: STRING, name: ds.0.items.0, value: 'DB *: Num of locks total'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'ZGBAA._hostid'}
                - {type: STRING, name: ds.0.color, value: '008E83'}
                - {type: INTEGER, name: ds.0.fill, value: '0'}
                - {type: INTEGER, name: ds.0.width, value: '2'}
            - type: svggraph
              name: '复制时间延迟（有副本时）'
              x: '14'
              'y': '4'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZGBAD'}
                - {type: STRING, name: time_period._reference, value: 'DASHBOARD._timeperiod'}
                - {type: INTEGER, name: legend_columns, value: '2'}
                - {type: INTEGER, name: legend_lines, value: '2'}
                - {type: STRING, name: lefty_min, value: '0'}
                - {type: STRING, name: ds.0.hosts.0, value: '*'}
                - {type: STRING, name: ds.0.items.0, value: 'Replication: Lag in seconds'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'ZGBAA._hostid'}
                - {type: STRING, name: ds.0.color, value: '008E83'}
                - {type: INTEGER, name: ds.0.fill, value: '0'}
                - {type: INTEGER, name: ds.0.width, value: '2'}
                - {type: STRING, name: ds.1.hosts.0, value: '*'}
                - {type: STRING, name: ds.1.items.0, value: 'Application *: Replication replay lag'}
                - {type: STRING, name: ds.1.override_hostid._reference, value: 'ZGBAA._hostid'}
                - {type: STRING, name: ds.1.color, value: '3478D3'}
                - {type: INTEGER, name: ds.1.fill, value: '0'}
                - {type: INTEGER, name: ds.1.width, value: '2'}
            - type: svggraph
              name: '复制字节差（有副本时）'
              x: '43'
              'y': '4'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZGBAE'}
                - {type: STRING, name: time_period._reference, value: 'DASHBOARD._timeperiod'}
                - {type: INTEGER, name: legend_columns, value: '2'}
                - {type: INTEGER, name: legend_lines, value: '2'}
                - {type: STRING, name: lefty_min, value: '0'}
                - {type: STRING, name: ds.0.hosts.0, value: '*'}
                - {type: STRING, name: ds.0.items.0, value: 'Replication: Lag in bytes'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'ZGBAA._hostid'}
                - {type: STRING, name: ds.0.color, value: '008E83'}
                - {type: INTEGER, name: ds.0.fill, value: '0'}
                - {type: INTEGER, name: ds.0.width, value: '2'}
            - type: problems
              name: '当前问题'
              x: '14'
              'y': '8'
              width: '58'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZGBAF'}
                - {type: STRING, name: hostids._reference, value: 'ZGBAA._hostids'}
                - {type: INTEGER, name: show, value: '3'}
                - {type: INTEGER, name: show_opdata, value: '2'}
                - {type: INTEGER, name: show_lines, value: '10'}
