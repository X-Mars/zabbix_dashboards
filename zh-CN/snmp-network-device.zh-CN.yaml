zabbix_export:
  version: '8.0'
  dashboards:
    - name: 'SNMP 网络设备与端口'
      auto_start: 'NO'
      pages:
        - name: '运行概览'
          widgets:
            - type: hostnavigator
              name: '按群组选择目标'
              x: '0'
              'y': '0'
              width: '14'
              height: '14'
              fields:
                - {type: STRING, name: reference, value: 'ZBAAA'}
                - {type: INTEGER, name: status, value: '0'}
                - {type: INTEGER, name: group_by.0.attribute, value: '0'}
                - {type: STRING, name: host_tags.0.tag, value: 'target'}
                - {type: INTEGER, name: host_tags.0.operator, value: '1'}
                - {type: STRING, name: host_tags.0.value, value: 'generic'}
            - type: hostcard
              name: '所选主机'
              x: '14'
              'y': '0'
              width: '19'
              height: '2'
              fields:
                - {type: STRING, name: hostid._reference, value: 'ZBAAA._hostid'}
                - {type: INTEGER, name: sections.0, value: '3'}
                - {type: INTEGER, name: sections.1, value: '4'}
            - type: tophosts
              name: '最新指标'
              x: '33'
              'y': '0'
              width: '39'
              height: '2'
              fields:
                - {type: STRING, name: reference, value: 'ZBAAB'}
                - {type: STRING, name: hostids._reference, value: 'ZBAAA._hostids'}
                - {type: INTEGER, name: maintenance, value: '1'}
                - {type: INTEGER, name: show_lines, value: '1'}
                - {type: INTEGER, name: column, value: '1'}
                - {type: INTEGER, name: columns.0.data, value: '2'}
                - {type: STRING, name: columns.0.name, value: '主机'}
                - {type: INTEGER, name: columns.1.data, value: '1'}
                - {type: STRING, name: columns.1.name, value: 'SNMP 状态'}
                - {type: STRING, name: columns.1.item, value: 'SNMP agent availability'}
                - {type: INTEGER, name: columns.1.decimal_places, value: '0'}
                - {type: INTEGER, name: columns.2.data, value: '1'}
                - {type: STRING, name: columns.2.name, value: '网络运行时长'}
                - {type: STRING, name: columns.2.item, value: 'Uptime (network)'}
                - {type: INTEGER, name: columns.2.decimal_places, value: '0'}
                - {type: INTEGER, name: columns.3.data, value: '1'}
                - {type: STRING, name: columns.3.name, value: '硬件运行时长'}
                - {type: STRING, name: columns.3.item, value: 'Uptime (hardware)'}
                - {type: INTEGER, name: columns.3.decimal_places, value: '0'}
                - {type: INTEGER, name: columns.4.data, value: '1'}
                - {type: STRING, name: columns.4.name, value: '往返时间'}
                - {type: STRING, name: columns.4.item, value: 'ICMP response time'}
            - type: svggraph
              name: '端口收发流量'
              x: '14'
              'y': '2'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZBAAC'}
                - {type: STRING, name: time_period._reference, value: 'DASHBOARD._timeperiod'}
                - {type: INTEGER, name: legend_columns, value: '2'}
                - {type: INTEGER, name: legend_lines, value: '2'}
                - {type: STRING, name: lefty_min, value: '0'}
                - {type: STRING, name: ds.0.hosts.0, value: '*'}
                - {type: STRING, name: ds.0.items.0, value: 'Interface *: Bits received'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'ZBAAA._hostid'}
                - {type: STRING, name: ds.0.color, value: '008E83'}
                - {type: INTEGER, name: ds.0.fill, value: '0'}
                - {type: INTEGER, name: ds.0.width, value: '2'}
                - {type: STRING, name: ds.1.hosts.0, value: '*'}
                - {type: STRING, name: ds.1.items.0, value: 'Interface *: Bits sent'}
                - {type: STRING, name: ds.1.override_hostid._reference, value: 'ZBAAA._hostid'}
                - {type: STRING, name: ds.1.color, value: '3478D3'}
                - {type: INTEGER, name: ds.1.fill, value: '0'}
                - {type: INTEGER, name: ds.1.width, value: '2'}
            - type: svggraph
              name: '错误和丢弃包'
              x: '43'
              'y': '2'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZBAAD'}
                - {type: STRING, name: time_period._reference, value: 'DASHBOARD._timeperiod'}
                - {type: INTEGER, name: legend_columns, value: '2'}
                - {type: INTEGER, name: legend_lines, value: '2'}
                - {type: STRING, name: lefty_min, value: '0'}
                - {type: STRING, name: ds.0.hosts.0, value: '*'}
                - {type: STRING, name: ds.0.items.0, value: 'Interface *: Inbound packets with errors'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'ZBAAA._hostid'}
                - {type: STRING, name: ds.0.color, value: '008E83'}
                - {type: INTEGER, name: ds.0.fill, value: '0'}
                - {type: INTEGER, name: ds.0.width, value: '2'}
                - {type: STRING, name: ds.1.hosts.0, value: '*'}
                - {type: STRING, name: ds.1.items.0, value: 'Interface *: Outbound packets with errors'}
                - {type: STRING, name: ds.1.override_hostid._reference, value: 'ZBAAA._hostid'}
                - {type: STRING, name: ds.1.color, value: '3478D3'}
                - {type: INTEGER, name: ds.1.fill, value: '0'}
                - {type: INTEGER, name: ds.1.width, value: '2'}
                - {type: STRING, name: ds.2.hosts.0, value: '*'}
                - {type: STRING, name: ds.2.items.0, value: 'Interface *: Inbound packets discarded'}
                - {type: STRING, name: ds.2.override_hostid._reference, value: 'ZBAAA._hostid'}
                - {type: STRING, name: ds.2.color, value: '8A53BC'}
                - {type: INTEGER, name: ds.2.fill, value: '0'}
                - {type: INTEGER, name: ds.2.width, value: '2'}
                - {type: STRING, name: ds.3.hosts.0, value: '*'}
                - {type: STRING, name: ds.3.items.0, value: 'Interface *: Outbound packets discarded'}
                - {type: STRING, name: ds.3.override_hostid._reference, value: 'ZBAAA._hostid'}
                - {type: STRING, name: ds.3.color, value: 'CD7227'}
                - {type: INTEGER, name: ds.3.fill, value: '0'}
                - {type: INTEGER, name: ds.3.width, value: '2'}
            - type: svggraph
              name: 'ICMP 往返时间'
              x: '14'
              'y': '6'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZBAAE'}
                - {type: STRING, name: time_period._reference, value: 'DASHBOARD._timeperiod'}
                - {type: INTEGER, name: legend_columns, value: '2'}
                - {type: INTEGER, name: legend_lines, value: '2'}
                - {type: STRING, name: lefty_min, value: '0'}
                - {type: STRING, name: ds.0.hosts.0, value: '*'}
                - {type: STRING, name: ds.0.items.0, value: 'ICMP response time'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'ZBAAA._hostid'}
                - {type: STRING, name: ds.0.color, value: '008E83'}
                - {type: INTEGER, name: ds.0.fill, value: '0'}
                - {type: INTEGER, name: ds.0.width, value: '2'}
            - type: svggraph
              name: 'ICMP 丢包率'
              x: '43'
              'y': '6'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZBAAF'}
                - {type: STRING, name: time_period._reference, value: 'DASHBOARD._timeperiod'}
                - {type: INTEGER, name: legend_columns, value: '2'}
                - {type: INTEGER, name: legend_lines, value: '2'}
                - {type: STRING, name: lefty_min, value: '0'}
                - {type: STRING, name: lefty_max, value: '100'}
                - {type: STRING, name: ds.0.hosts.0, value: '*'}
                - {type: STRING, name: ds.0.items.0, value: 'ICMP loss'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'ZBAAA._hostid'}
                - {type: STRING, name: ds.0.color, value: '008E83'}
                - {type: INTEGER, name: ds.0.fill, value: '0'}
                - {type: INTEGER, name: ds.0.width, value: '2'}
            - type: topitems
              name: '端口运行状态'
              x: '14'
              'y': '10'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: hostids._reference, value: 'ZBAAA._hostids'}
                - {type: INTEGER, name: layout, value: '1'}
                - {type: INTEGER, name: host_ordering_limit, value: '1'}
                - {type: INTEGER, name: item_ordering_order_by, value: '2'}
                - {type: INTEGER, name: item_ordering_order, value: '3'}
                - {type: INTEGER, name: item_ordering_limit, value: '10'}
                - {type: STRING, name: columns.0.items.0, value: 'Interface *: Operational status'}
            - type: problems
              name: '当前问题'
              x: '43'
              'y': '10'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZBAAG'}
                - {type: STRING, name: hostids._reference, value: 'ZBAAA._hostids'}
                - {type: INTEGER, name: show, value: '3'}
                - {type: INTEGER, name: show_opdata, value: '2'}
                - {type: INTEGER, name: show_lines, value: '10'}
