zabbix_export:
  version: '8.0'
  dashboards:
    - name: 'MySQL 性能与复制'
      auto_start: 'NO'
      pages:
        - name: '负载与连接'
          widgets:
            - type: hostnavigator
              name: '按群组选择目标'
              x: '0'
              'y': '0'
              width: '14'
              height: '14'
              fields:
                - {type: STRING, name: reference, value: 'ZFAAA'}
                - {type: INTEGER, name: status, value: '0'}
                - {type: INTEGER, name: group_by.0.attribute, value: '0'}
                - {type: STRING, name: host_tags.0.tag, value: 'target'}
                - {type: INTEGER, name: host_tags.0.operator, value: '1'}
                - {type: STRING, name: host_tags.0.value, value: 'mysql'}
            - type: hostcard
              name: '所选主机'
              x: '14'
              'y': '0'
              width: '19'
              height: '2'
              fields:
                - {type: STRING, name: hostid._reference, value: 'ZFAAA._hostid'}
                - {type: INTEGER, name: sections.0, value: '3'}
                - {type: INTEGER, name: sections.1, value: '4'}
            - type: tophosts
              name: '最新指标'
              x: '33'
              'y': '0'
              width: '39'
              height: '2'
              fields:
                - {type: STRING, name: reference, value: 'ZFAAB'}
                - {type: STRING, name: hostids._reference, value: 'ZFAAA._hostids'}
                - {type: INTEGER, name: maintenance, value: '1'}
                - {type: INTEGER, name: show_lines, value: '1'}
                - {type: INTEGER, name: column, value: '1'}
                - {type: INTEGER, name: columns.0.data, value: '2'}
                - {type: STRING, name: columns.0.name, value: '主机'}
                - {type: INTEGER, name: columns.1.data, value: '1'}
                - {type: STRING, name: columns.1.name, value: '状态'}
                - {type: STRING, name: columns.1.item, value: 'Status'}
                - {type: INTEGER, name: columns.1.decimal_places, value: '0'}
                - {type: INTEGER, name: columns.2.data, value: '1'}
                - {type: STRING, name: columns.2.name, value: '版本'}
                - {type: STRING, name: columns.2.item, value: 'Version'}
                - {type: INTEGER, name: columns.2.display_value_as, value: '1'}
                - {type: INTEGER, name: columns.3.data, value: '1'}
                - {type: STRING, name: columns.3.name, value: '运行时长'}
                - {type: STRING, name: columns.3.item, value: 'Uptime'}
                - {type: INTEGER, name: columns.3.decimal_places, value: '0'}
                - {type: INTEGER, name: columns.4.data, value: '1'}
                - {type: STRING, name: columns.4.name, value: '运行线程'}
                - {type: STRING, name: columns.4.item, value: 'Threads running'}
                - {type: INTEGER, name: columns.4.decimal_places, value: '0'}
                - {type: INTEGER, name: columns.5.data, value: '1'}
                - {type: STRING, name: columns.5.name, value: '慢查询/秒'}
                - {type: STRING, name: columns.5.item, value: 'Slow queries per second'}
            - type: svggraph
              name: '查询与请求速率'
              x: '14'
              'y': '2'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZFAAC'}
                - {type: STRING, name: time_period._reference, value: 'DASHBOARD._timeperiod'}
                - {type: INTEGER, name: legend_columns, value: '2'}
                - {type: INTEGER, name: legend_lines, value: '2'}
                - {type: STRING, name: lefty_min, value: '0'}
                - {type: STRING, name: ds.0.hosts.0, value: '*'}
                - {type: STRING, name: ds.0.items.0, value: 'Queries per second'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'ZFAAA._hostid'}
                - {type: STRING, name: ds.0.color, value: '008E83'}
                - {type: INTEGER, name: ds.0.fill, value: '0'}
                - {type: INTEGER, name: ds.0.width, value: '2'}
                - {type: STRING, name: ds.1.hosts.0, value: '*'}
                - {type: STRING, name: ds.1.items.0, value: 'Questions per second'}
                - {type: STRING, name: ds.1.override_hostid._reference, value: 'ZFAAA._hostid'}
                - {type: STRING, name: ds.1.color, value: '3478D3'}
