                - {type: STRING, name: time_period._reference, value: 'DASHBOARD._timeperiod'}
                - {type: INTEGER, name: legend_columns, value: '2'}
                - {type: INTEGER, name: legend_lines, value: '2'}
                - {type: STRING, name: lefty_min, value: '0'}
                - {type: STRING, name: ds.0.hosts.0, value: '*'}
                - {type: STRING, name: ds.0.items.0, value: 'Slow queries per second'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'ZFAAA._hostid'}
