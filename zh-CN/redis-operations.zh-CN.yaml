                - {type: STRING, name: columns.4.name, value: '已用内存'}
                - {type: STRING, name: columns.4.item, value: 'Memory used'}
                - {type: INTEGER, name: columns.4.decimal_places, value: '0'}
                - {type: INTEGER, name: columns.5.data, value: '1'}
                - {type: STRING, name: columns.5.name, value: '每秒操作数'}
                - {type: STRING, name: columns.5.item, value: 'Instantaneous operations per sec'}
                - {type: INTEGER, name: columns.5.decimal_places, value: '0'}
            - type: svggraph
              name: '客户端与阻塞'
              x: '14'
              'y': '2'
              width: '29'
              height: '4'
              fields:
