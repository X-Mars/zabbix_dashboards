zabbix_export:
  version: '8.0'
  dashboards:
    - name: 'Zabbix 服务端全景状态'
      auto_start: 'NO'
      pages:
        - name: '平台健康'
          widgets:
            - type: hostnavigator
              name: 'Zabbix 主机'
              x: '0'
              'y': '0'
              width: '13'
              height: '5'
              fields:
                - {type: STRING, name: reference, value: 'ZPHST'}
                - {type: INTEGER, name: status, value: '0'}
                - {type: INTEGER, name: group_by.0.attribute, value: '0'}
                - {type: STRING, name: host_tags.0.tag, value: 'target'}
                - {type: INTEGER, name: host_tags.0.operator, value: '1'}
                - {type: STRING, name: host_tags.0.value, value: 'zabbix'}
            - type: systeminfo
              name: '本实例系统信息'
              x: '13'
              'y': '0'
              width: '27'
              height: '5'
              fields:
                - {type: INTEGER, name: rf_rate, value: '60'}
            - type: tophosts
              name: '所选主机的采集状态'
              x: '40'
              'y': '0'
              width: '32'
              height: '2'
              fields:
                - {type: STRING, name: reference, value: 'ZPSNP'}
                - {type: STRING, name: hostids._reference, value: 'ZPHST._hostids'}
                - {type: INTEGER, name: maintenance, value: '1'}
                - {type: INTEGER, name: show_lines, value: '1'}
                - {type: INTEGER, name: column, value: '1'}
                - {type: INTEGER, name: columns.0.data, value: '2'}
                - {type: STRING, name: columns.0.name, value: '主机'}
                - {type: STRING, name: columns.1.name, value: '版本'}
                - {type: INTEGER, name: columns.1.data, value: '1'}
                - {type: STRING, name: columns.1.item, value: 'Version'}
                - {type: INTEGER, name: columns.1.display_value_as, value: '1'}
                - {type: STRING, name: columns.2.name, value: '采集速率'}
                - {type: INTEGER, name: columns.2.data, value: '1'}
                - {type: STRING, name: columns.2.item, value: 'Number of processed values per second'}
                - {type: STRING, name: columns.3.name, value: '队列'}
                - {type: INTEGER, name: columns.3.data, value: '1'}
                - {type: STRING, name: columns.3.item, value: 'Queue'}
                - {type: INTEGER, name: columns.3.decimal_places, value: '0'}
                - {type: STRING, name: columns.4.name, value: '延迟 ≥10 分钟'}
                - {type: INTEGER, name: columns.4.data, value: '1'}
                - {type: STRING, name: columns.4.item, value: 'Queue over 10 minutes'}
                - {type: INTEGER, name: columns.4.decimal_places, value: '0'}
            - type: problems
              name: '当前问题'
              x: '40'
              'y': '2'
              width: '32'
              height: '3'
              fields:
                - {type: STRING, name: reference, value: 'ZPPBL'}
                - {type: STRING, name: hostids._reference, value: 'ZPHST._hostids'}
                - {type: INTEGER, name: show, value: '3'}
                - {type: INTEGER, name: show_lines, value: '6'}
                - {type: INTEGER, name: show_opdata, value: '2'}
            - type: svggraph
              name: '采集与数据库写入速率'
              x: '0'
              'y': '5'
              width: '36'
              height: '4'
              fields:
