                - {type: INTEGER, name: legend_columns, value: '2'}
                - {type: INTEGER, name: legend_lines, value: '2'}
                - {type: STRING, name: lefty_min, value: '0'}
                - {type: STRING, name: ds.0.hosts.0, value: '*'}
                - {type: STRING, name: ds.0.items.0, value: 'Bytes received'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'ZFAAA._hostid'}
                - {type: STRING, name: ds.0.color, value: '008E83'}
                - {type: INTEGER, name: ds.0.fill, value: '0'}
                - {type: INTEGER, name: ds.0.width, value: '2'}
                - {type: STRING, name: ds.1.hosts.0, value: '*'}
                - {type: STRING, name: ds.1.items.0, value: 'Bytes sent'}
                - {type: STRING, name: ds.1.override_hostid._reference, value: 'ZFAAA._hostid'}
                - {type: STRING, name: ds.1.color, value: '3478D3'}
                - {type: INTEGER, name: ds.1.fill, value: '0'}
                - {type: INTEGER, name: ds.1.width, value: '2'}
            - type: problems
              name: 'Current problems'
              x: '14'
              'y': '10'
              width: '58'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZFAAG'}
                - {type: STRING, name: hostids._reference, value: 'ZFAAA._hostids'}
                - {type: INTEGER, name: show, value: '3'}
                - {type: INTEGER, name: show_opdata, value: '2'}
                - {type: INTEGER, name: show_lines, value: '10'}
