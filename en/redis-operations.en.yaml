                - {type: STRING, name: ds.0.items.0, value: 'Memory used'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'ZHAAA._hostid'}
                - {type: STRING, name: ds.0.color, value: '008E83'}
                - {type: INTEGER, name: ds.0.fill, value: '0'}
                - {type: INTEGER, name: ds.0.width, value: '2'}
