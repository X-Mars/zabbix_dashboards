---
zabbix_export:
  version: '8.0'
  dashboards:
  - name: Switch Ports
    auto_start: 'NO'
    pages:
    - name: Port status and traffic
      widgets:
      - type: hostnavigator
        name: Targets by group
        x: '0'
        y: '0'
        width: '14'
        height: '18'
        fields:
        - type: STRING
          name: reference
          value: ZBAAA
        - type: INTEGER
          name: status
          value: '0'
        - type: INTEGER
          name: group_by.0.attribute
          value: '0'
        - type: STRING
          name: host_tags.0.tag
          value: target
        - type: INTEGER
          name: host_tags.0.operator
          value: '1'
        - type: STRING
          name: host_tags.0.value
          value: generic
      - type: honeycomb
        name: Port administrative status
        x: '14'
        y: '0'
        width: '29'
        height: '8'
        fields:
        - type: STRING
          name: reference
          value: SWHEX
        - type: STRING
          name: hostids._reference
          value: ZBAAA._hostids
        - type: STRING
          name: items.0
          value: 'Interface *: Administrative status'
        - type: STRING
          name: primary_label
          value: "{ITEM.NAME}"
        - type: STRING
          name: bg_color
          value: 35BFA0
        - type: STRING
          name: thresholds.0.threshold
          value: '2'
        - type: STRING
          name: thresholds.0.color
          value: FF465C
      - type: topitems
        name: Operational status
        x: '43'
        y: '0'
        width: '29'
        height: '8'
        fields:
        - type: STRING
          name: hostids._reference
          value: ZBAAA._hostids
        - type: INTEGER
          name: layout
          value: '1'
        - type: INTEGER
          name: host_ordering_limit
          value: '1'
        - type: INTEGER
          name: item_ordering_order_by
          value: '2'
        - type: INTEGER
          name: item_ordering_order
          value: '3'
        - type: INTEGER
          name: item_ordering_limit
          value: '50'
        - type: STRING
          name: columns.0.items.0
          value: 'Interface *: Operational status'
      - type: topitems
        name: Inbound traffic
        x: '14'
        y: '8'
        width: '29'
        height: '8'
        fields:
        - type: STRING
          name: hostids._reference
          value: ZBAAA._hostids
        - type: INTEGER
          name: layout
          value: '1'
        - type: INTEGER
          name: host_ordering_limit
          value: '1'
        - type: INTEGER
          name: item_ordering_order_by
          value: '2'
        - type: INTEGER
          name: item_ordering_order
          value: '3'
        - type: INTEGER
          name: item_ordering_limit
          value: '50'
        - type: STRING
          name: columns.0.items.0
          value: 'Interface *: Bits received'
      - type: topitems
        name: Outbound traffic
        x: '43'
        y: '8'
        width: '29'
        height: '8'
        fields:
        - type: STRING
          name: hostids._reference
          value: ZBAAA._hostids
        - type: INTEGER
          name: layout
          value: '1'
        - type: INTEGER
          name: host_ordering_limit
          value: '1'
        - type: INTEGER
          name: item_ordering_order_by
          value: '2'
        - type: INTEGER
          name: item_ordering_order
          value: '3'
        - type: INTEGER
          name: item_ordering_limit
          value: '50'
        - type: STRING
          name: columns.0.items.0
          value: 'Interface *: Bits sent'
      - type: problems
        name: Current problems
        x: '14'
        y: '16'
        width: '58'
        height: '4'
        fields:
        - type: STRING
          name: reference
          value: SWPRB
        - type: INTEGER
          name: show
          value: '3'
        - type: INTEGER
          name: show_opdata
          value: '2'
        - type: INTEGER
          name: show_lines
          value: '20'
        - type: STRING
          name: hostids._reference
          value: ZBAAA._hostids
