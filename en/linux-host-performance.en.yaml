                - {type: STRING, name: ds.0.items.0, value: 'Load average (1m avg)'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'LPHST._hostid'}
                - {type: STRING, name: ds.0.color, value: '008E83'}
                - {type: INTEGER, name: ds.0.width, value: '2'}
                - {type: INTEGER, name: ds.0.fill, value: '0'}
                - {type: STRING, name: ds.1.hosts.0, value: '*'}
                - {type: STRING, name: ds.1.items.0, value: 'Load average (5m avg)'}
                - {type: STRING, name: ds.1.override_hostid._reference, value: 'LPHST._hostid'}
