zabbix_export:
  version: '8.0'
  dashboards:
    - name: 'Linux Host Performance'
      auto_start: 'NO'
      pages:
        - name: 'Host overview'
          widgets:
            - type: hostnavigator
              name: 'Linux hosts by group'
              x: '0'
              'y': '0'
              width: '13'
              height: '15'
              fields:
                - {type: STRING, name: reference, value: 'LPHST'}
                - {type: INTEGER, name: status, value: '0'}
                - {type: INTEGER, name: group_by.0.attribute, value: '0'}
                - {type: STRING, name: host_tags.0.tag, value: 'target'}
                - {type: INTEGER, name: host_tags.0.operator, value: '1'}
                - {type: STRING, name: host_tags.0.value, value: 'linux'}
            - type: hostcard
              name: 'Host and agent status'
              x: '13'
              'y': '0'
              width: '22'
              height: '3'
              fields:
                - {type: STRING, name: hostid._reference, value: 'LPHST._hostid'}
                - {type: INTEGER, name: sections.0, value: '3'}
                - {type: INTEGER, name: sections.1, value: '4'}
                - {type: INTEGER, name: sections.2, value: '2'}
            - type: tophosts
              name: 'Latest metrics'
              x: '35'
              'y': '0'
              width: '37'
              height: '3'
              fields:
                - {type: STRING, name: reference, value: 'LPSNP'}
                - {type: STRING, name: hostids._reference, value: 'LPHST._hostids'}
                - {type: INTEGER, name: maintenance, value: '1'}
                - {type: INTEGER, name: show_lines, value: '1'}
                - {type: INTEGER, name: column, value: '1'}
                - {type: INTEGER, name: columns.0.data, value: '2'}
                - {type: STRING, name: columns.0.name, value: 'Host'}
                - {type: STRING, name: columns.1.name, value: 'Uptime'}
                - {type: INTEGER, name: columns.1.data, value: '1'}
                - {type: STRING, name: columns.1.item, value: 'System uptime'}
                - {type: INTEGER, name: columns.1.decimal_places, value: '0'}
                - {type: STRING, name: columns.2.name, value: 'Logical CPUs'}
                - {type: INTEGER, name: columns.2.data, value: '1'}
                - {type: STRING, name: columns.2.item, value: 'Number of CPUs'}
                - {type: INTEGER, name: columns.2.decimal_places, value: '0'}
                - {type: STRING, name: columns.3.name, value: 'Total memory'}
                - {type: INTEGER, name: columns.3.data, value: '1'}
                - {type: STRING, name: columns.3.item, value: 'Total memory'}
                - {type: STRING, name: columns.4.name, value: 'Logged-in users'}
                - {type: INTEGER, name: columns.4.data, value: '1'}
                - {type: STRING, name: columns.4.item, value: 'Number of logged in users'}
                - {type: INTEGER, name: columns.4.decimal_places, value: '0'}
                - {type: STRING, name: columns.5.name, value: 'Operating system'}
                - {type: INTEGER, name: columns.5.data, value: '1'}
                - {type: STRING, name: columns.5.item, value: 'Operating system'}
                - {type: INTEGER, name: columns.5.display_value_as, value: '1'}
            - type: svggraph
              name: 'CPU utilization and I/O wait'
              x: '13'
              'y': '3'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'LPCPU'}
                - {type: STRING, name: time_period._reference, value: 'DASHBOARD._timeperiod'}
                - {type: STRING, name: lefty_min, value: '0'}
                - {type: INTEGER, name: legend_columns, value: '2'}
                - {type: INTEGER, name: legend_lines, value: '3'}
                - {type: STRING, name: ds.0.hosts.0, value: '*'}
                - {type: STRING, name: ds.0.items.0, value: 'CPU utilization'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'LPHST._hostid'}
                - {type: STRING, name: ds.0.color, value: '008E83'}
                - {type: INTEGER, name: ds.0.width, value: '2'}
                - {type: INTEGER, name: ds.0.fill, value: '0'}
                - {type: STRING, name: ds.1.hosts.0, value: '*'}
                - {type: STRING, name: ds.1.items.0, value: 'CPU iowait time'}
                - {type: STRING, name: ds.1.override_hostid._reference, value: 'LPHST._hostid'}
                - {type: STRING, name: ds.1.color, value: '3478D3'}
                - {type: INTEGER, name: ds.1.width, value: '2'}
