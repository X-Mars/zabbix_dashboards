zabbix_export:
  version: '8.0'
  dashboards:
    - name: 'ICMP Reachability and Latency'
      auto_start: 'NO'
      pages:
        - name: 'Overview'
          widgets:
            - type: hostnavigator
              name: 'Targets by group'
              x: '0'
              'y': '0'
              width: '14'
              height: '14'
              fields:
                - {type: STRING, name: reference, value: 'ZCAAA'}
                - {type: INTEGER, name: status, value: '0'}
                - {type: INTEGER, name: group_by.0.attribute, value: '0'}
                - {type: STRING, name: host_tags.0.tag, value: 'target'}
                - {type: INTEGER, name: host_tags.0.operator, value: '1'}
                - {type: STRING, name: host_tags.0.value, value: 'icmp'}
            - type: hostcard
              name: 'Selected host'
              x: '14'
              'y': '0'
              width: '19'
              height: '2'
              fields:
                - {type: STRING, name: hostid._reference, value: 'ZCAAA._hostid'}
                - {type: INTEGER, name: sections.0, value: '3'}
                - {type: INTEGER, name: sections.1, value: '4'}
            - type: tophosts
              name: 'Latest metrics'
              x: '33'
              'y': '0'
              width: '39'
              height: '2'
              fields:
                - {type: STRING, name: reference, value: 'ZCAAB'}
                - {type: STRING, name: hostids._reference, value: 'ZCAAA._hostids'}
                - {type: INTEGER, name: maintenance, value: '1'}
                - {type: INTEGER, name: show_lines, value: '1'}
                - {type: INTEGER, name: column, value: '1'}
                - {type: INTEGER, name: columns.0.data, value: '2'}
                - {type: STRING, name: columns.0.name, value: 'Host'}
                - {type: INTEGER, name: columns.1.data, value: '1'}
                - {type: STRING, name: columns.1.name, value: 'Ping state'}
                - {type: STRING, name: columns.1.item, value: 'ICMP ping'}
                - {type: INTEGER, name: columns.1.decimal_places, value: '0'}
                - {type: INTEGER, name: columns.2.data, value: '1'}
                - {type: STRING, name: columns.2.name, value: 'Packet loss'}
                - {type: STRING, name: columns.2.item, value: 'ICMP loss'}
                - {type: INTEGER, name: columns.3.data, value: '1'}
                - {type: STRING, name: columns.3.name, value: 'Round-trip time'}
                - {type: STRING, name: columns.3.item, value: 'ICMP response time'}
            - type: svggraph
              name: 'Round-trip time'
              x: '14'
              'y': '2'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZCAAC'}
                - {type: STRING, name: time_period._reference, value: 'DASHBOARD._timeperiod'}
                - {type: INTEGER, name: legend_columns, value: '2'}
                - {type: INTEGER, name: legend_lines, value: '2'}
                - {type: STRING, name: lefty_min, value: '0'}
                - {type: STRING, name: ds.0.hosts.0, value: '*'}
                - {type: STRING, name: ds.0.items.0, value: 'ICMP response time'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'ZCAAA._hostid'}
                - {type: STRING, name: ds.0.color, value: '008E83'}
                - {type: INTEGER, name: ds.0.fill, value: '0'}
                - {type: INTEGER, name: ds.0.width, value: '2'}
            - type: svggraph
              name: 'Packet loss'
              x: '43'
              'y': '2'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZCAAD'}
                - {type: STRING, name: time_period._reference, value: 'DASHBOARD._timeperiod'}
                - {type: INTEGER, name: legend_columns, value: '2'}
                - {type: INTEGER, name: legend_lines, value: '2'}
                - {type: STRING, name: lefty_min, value: '0'}
                - {type: STRING, name: lefty_max, value: '100'}
                - {type: STRING, name: ds.0.hosts.0, value: '*'}
                - {type: STRING, name: ds.0.items.0, value: 'ICMP loss'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'ZCAAA._hostid'}
                - {type: STRING, name: ds.0.color, value: '008E83'}
                - {type: INTEGER, name: ds.0.fill, value: '0'}
                - {type: INTEGER, name: ds.0.width, value: '2'}
            - type: svggraph
              name: 'Reachability state'
              x: '14'
              'y': '6'
              width: '58'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZCAAE'}
                - {type: STRING, name: time_period._reference, value: 'DASHBOARD._timeperiod'}
                - {type: INTEGER, name: legend_columns, value: '2'}
                - {type: INTEGER, name: legend_lines, value: '2'}
                - {type: STRING, name: lefty_min, value: '0'}
                - {type: STRING, name: lefty_max, value: '1'}
                - {type: STRING, name: ds.0.hosts.0, value: '*'}
                - {type: STRING, name: ds.0.items.0, value: 'ICMP ping'}
                - {type: STRING, name: ds.0.override_hostid._reference, value: 'ZCAAA._hostid'}
                - {type: STRING, name: ds.0.color, value: '008E83'}
                - {type: INTEGER, name: ds.0.fill, value: '0'}
                - {type: INTEGER, name: ds.0.width, value: '2'}
                - {type: INTEGER, name: ds.0.type, value: '2'}
            - type: tophosts
              name: 'Targets with highest packet loss'
              x: '14'
              'y': '10'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZCAAF'}
                - {type: STRING, name: tags.0.tag, value: 'target'}
                - {type: INTEGER, name: tags.0.operator, value: '1'}
                - {type: STRING, name: tags.0.value, value: 'icmp'}
                - {type: INTEGER, name: column, value: '1'}
                - {type: INTEGER, name: show_lines, value: '10'}
                - {type: INTEGER, name: columns.1.display, value: '3'}
                - {type: STRING, name: columns.1.min, value: '0'}
                - {type: STRING, name: columns.1.max, value: '100'}
                - {type: STRING, name: columns.1.base_color, value: 'E18D35'}
                - {type: INTEGER, name: columns.0.data, value: '2'}
                - {type: STRING, name: columns.0.name, value: 'Host'}
                - {type: INTEGER, name: columns.1.data, value: '1'}
                - {type: STRING, name: columns.1.name, value: 'Packet loss'}
                - {type: STRING, name: columns.1.item, value: 'ICMP loss'}
            - type: problems
              name: 'Current problems'
              x: '43'
              'y': '10'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZCAAG'}
                - {type: STRING, name: hostids._reference, value: 'ZCAAA._hostids'}
                - {type: INTEGER, name: show, value: '3'}
                - {type: INTEGER, name: show_opdata, value: '2'}
                - {type: INTEGER, name: show_lines, value: '10'}
