zabbix_export:
  version: '8.0'
  dashboards:
    - name: 'TLS Certificate Expiry'
      auto_start: 'NO'
      pages:
        - name: 'Overview'
          widgets:
            - type: hostnavigator
              name: 'Targets by group'
              x: '0'
              'y': '0'
              width: '14'
              height: '12'
              fields:
                - {type: STRING, name: reference, value: 'ZEAAA'}
                - {type: INTEGER, name: status, value: '0'}
                - {type: INTEGER, name: group_by.0.attribute, value: '0'}
                - {type: STRING, name: host_tags.0.tag, value: 'target'}
                - {type: INTEGER, name: host_tags.0.operator, value: '1'}
                - {type: STRING, name: host_tags.0.value, value: 'certificate'}
            - type: topitems
              name: 'Earliest expirations (all hosts)'
              x: '14'
              'y': '0'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: host_tags.0.tag, value: 'target'}
                - {type: INTEGER, name: host_tags.0.operator, value: '1'}
                - {type: STRING, name: host_tags.0.value, value: 'certificate'}
                - {type: INTEGER, name: layout, value: '1'}
                - {type: INTEGER, name: host_ordering_limit, value: '100'}
                - {type: INTEGER, name: item_ordering_order_by, value: '3'}
                - {type: INTEGER, name: item_ordering_order, value: '3'}
                - {type: INTEGER, name: item_ordering_limit, value: '10'}
                - {type: STRING, name: columns.0.items.0, value: '*: Expires on'}
            - type: topitems
              name: 'Selected host certificate validation'
              x: '43'
              'y': '0'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: hostids._reference, value: 'ZEAAA._hostids'}
                - {type: INTEGER, name: layout, value: '1'}
                - {type: INTEGER, name: host_ordering_limit, value: '1'}
                - {type: INTEGER, name: item_ordering_order_by, value: '2'}
                - {type: INTEGER, name: item_ordering_order, value: '3'}
                - {type: INTEGER, name: item_ordering_limit, value: '10'}
                - {type: STRING, name: columns.0.items.0, value: '*: Validation result'}
                - {type: INTEGER, name: columns.0.display_value_as, value: '2'}
            - type: topitems
              name: 'Selected host certificate start dates'
              x: '14'
              'y': '4'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: hostids._reference, value: 'ZEAAA._hostids'}
                - {type: INTEGER, name: layout, value: '1'}
                - {type: INTEGER, name: host_ordering_limit, value: '1'}
                - {type: INTEGER, name: item_ordering_order_by, value: '3'}
                - {type: INTEGER, name: item_ordering_order, value: '3'}
                - {type: INTEGER, name: item_ordering_limit, value: '10'}
                - {type: STRING, name: columns.0.items.0, value: '*: Valid from'}
            - type: topitems
              name: 'Selected host signature algorithms'
              x: '43'
              'y': '4'
              width: '29'
              height: '4'
              fields:
                - {type: STRING, name: hostids._reference, value: 'ZEAAA._hostids'}
                - {type: INTEGER, name: layout, value: '1'}
                - {type: INTEGER, name: host_ordering_limit, value: '1'}
                - {type: INTEGER, name: item_ordering_order_by, value: '2'}
                - {type: INTEGER, name: item_ordering_order, value: '3'}
                - {type: INTEGER, name: item_ordering_limit, value: '10'}
                - {type: STRING, name: columns.0.items.0, value: '*: Signature algorithm'}
                - {type: INTEGER, name: columns.0.display_value_as, value: '2'}
            - type: problems
              name: 'Current problems'
              x: '14'
              'y': '8'
              width: '58'
              height: '4'
              fields:
                - {type: STRING, name: reference, value: 'ZEAAB'}
                - {type: STRING, name: hostids._reference, value: 'ZEAAA._hostids'}
                - {type: INTEGER, name: show, value: '3'}
                - {type: INTEGER, name: show_opdata, value: '2'}
                - {type: INTEGER, name: show_lines, value: '10'}
