                - {type: INTEGER, name: item_ordering_limit, value: '10'}
                - {type: STRING, name: columns.0.items.0, value: 'Container *: Health status'}
            - type: problems
              name: 'Current problems'
              x: '43'
              'y': '14'
              width: '29'
              height: '4'
              fields:
